[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physlab"
version = "0.1.0"
description = "Extract physical constants with uncertainties from phone videos of simple experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "meta_sam_parser>=0.1.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["physlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
